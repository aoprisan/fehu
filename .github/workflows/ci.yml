# Everything `just ci` runs, on every push and pull request. The `justfile`
# is the recipe; this file only provides the toolchains it assumes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/fehu-economy/ui/package-lock.json

      - uses: Swatinem/rust-cache@v2

      # The same order as `just ci`, one step each so a failure names its
      # recipe. `wasm` adds the target itself; the toolchain step above
      # already did, so it is a no-op there.
      - run: just lint
      - run: just build
      - run: just test
      - run: just wasm
      - run: just ui-check
