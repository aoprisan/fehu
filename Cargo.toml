# Virtual workspace root: the utilities library and the economy server that
# runs it. The root builds nothing itself on purpose — a bare
# `cargo build --no-default-features` here would also build the server, whose
# dependency on `fehu` re-enables `std` and unifies the no_std check away, so
# every library command names `-p fehu`. See the `justfile`.
[workspace]
members = ["crates/fehu", "crates/fehu-economy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aoprisan/fehu"

[profile.bench]
debug = false
