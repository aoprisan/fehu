[package]
name = "fehu-webapp"
version = "0.1.0"
edition = "2024"
publish = false
description = "Sample axum backend: four seeded fehu symbols, an OHLC bar UI, and endpoints that ingest game events"
license = "MIT OR Apache-2.0"

[dependencies]
fehu = { path = "..", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
